<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800">
  <style>
    .bg{fill:#060606}
    .box{fill:#0f1720;stroke:#1f2937;stroke-width:2;rx:12}
    .svc{fill:#0b1220;stroke:#334155;stroke-width:2}
    .line{stroke:#3b82f6;stroke-width:3;fill:none;marker-end:url(#arr)}
    .text-main{fill:#e6eef8;font-family:Inter,system-ui,Arial;font-weight:700}
    .text-sub{fill:#9fb3d6;font-family:Inter,system-ui,Arial;font-weight:600}
    .node{fill:#06b6d4}
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Title -->
  <text x="64" y="90" font-size="44" class="text-main">ThinkCoder</text>
  <text x="64" y="128" font-size="18" class="text-sub">System design. Session-based orchestration for AI problems.</text>

  <!-- Client -->
  <rect x="64" y="180" width="220" height="90" rx="10" class="box"/>
  <text x="84" y="230" font-size="18" class="text-main">Browser / Client</text>
  <text x="84" y="255" font-size="13" class="text-sub">Editor, submit problem</text>

  <!-- API Gateway -->
  <rect x="320" y="160" width="260" height="130" rx="10" class="svc"/>
  <text x="350" y="210" font-size="18" class="text-main">API / Orchestrator</text>
  <text x="350" y="235" font-size="13" class="text-sub">FastAPI. Routes to LangGraph</text>

  <!-- LangGraph -->
  <rect x="620" y="140" width="260" height="170" rx="12" class="box"/>
  <text x="650" y="200" font-size="18" class="text-main">LangGraph</text>
  <text x="650" y="230" font-size="13" class="text-sub">Stateful sessions per problem</text>

  <!-- LiteLLM Router -->
  <rect x="940" y="120" width="220" height="90" rx="10" class="svc"/>
  <text x="960" y="160" font-size="16" class="text-main">LiteLLM Router</text>
  <text x="960" y="180" font-size="12" class="text-sub">Route to Local / Cloud</text>

  <!-- Local Model -->
  <rect x="1200" y="100" width="160" height="70" rx="8" class="box"/>
  <text x="1220" y="140" font-size="14" class="text-main">Ollama</text>
  <text x="1220" y="158" font-size="11" class="text-sub">Qwen2.5-Coder-7B</text>

  <!-- Gemini -->
  <rect x="1200" y="220" width="160" height="70" rx="8" class="box"/>
  <text x="1220" y="260" font-size="14" class="text-main">Gemini</text>
  <text x="1220" y="278" font-size="11" class="text-sub">Cloud model for hard requests</text>

  <!-- Database -->
  <rect x="620" y="340" width="260" height="110" rx="10" class="svc"/>
  <text x="650" y="380" font-size="18" class="text-main">PostgreSQL</text>
  <text x="650" y="405" font-size="13" class="text-sub">Sessions, metadata, entitlements</text>

  <!-- Arrows -->
  <path class="line" d="M284 225 L320 225" />
  <path class="line" d="M580 220 L620 200" />
  <path class="line" d="M880 210 L940 165" />
  <path class="line" d="M1160 165 L1200 135" />
  <path class="line" d="M1160 240 L1200 255" />
  <path class="line" d="M750 310 L750 340" />

  <!-- small nodes/hints -->
  <circle cx="560" cy="210" r="6" class="node"/>
  <circle cx="900" cy="200" r="6" class="node"/>

  <!-- footer note -->
  <text x="64" y="760" font-size="12" fill="#72839b">Bekzat Uraimov · Backend engineer. Python · FastAPI · PostgreSQL</text>
</svg>
