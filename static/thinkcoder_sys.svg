<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <style>
    .bg{fill:#060606}
    .box{fill:#0f1720;stroke:#1f2937;stroke-width:2;rx:12}
    .svc{fill:#0b1220;stroke:#334155;stroke-width:2}
    .line{stroke:#3b82f6;stroke-width:3;fill:none;marker-end:url(#arr)}
    .text-main{fill:#e6eef8;font-family:Inter,system-ui,Arial;font-weight:700}
    .text-sub{fill:#9fb3d6;font-family:Inter,system-ui,Arial;font-weight:600}
    .node{fill:#06b6d4}
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Title -->
  <text x="64" y="120" font-size="52" class="text-main">ThinkCoder</text>
  <text x="64" y="164" font-size="20" class="text-sub">System design. Session-based orchestration for AI problems.</text>

  <!-- Client -->
  <rect x="64" y="230" width="220" height="110" rx="10" class="box"/>
  <text x="84" y="290" font-size="20" class="text-main">Browser / Client</text>
  <text x="84" y="322" font-size="14" class="text-sub">Editor, submit problem</text>

  <!-- API Gateway -->
  <rect x="320" y="215" width="320" height="150" rx="10" class="svc"/>
  <text x="360" y="275" font-size="20" class="text-main">API / Orchestrator</text>
  <text x="360" y="305" font-size="14" class="text-sub">FastAPI. Routes to LangGraph</text>

  <!-- LangGraph -->
  <rect x="620" y="220" width="360" height="200" rx="12" class="box"/>
  <text x="660" y="300" font-size="22" class="text-main">LangGraph</text>
  <text x="660" y="334" font-size="14" class="text-sub">Stateful sessions per problem</text>

  <!-- LiteLLM Router -->
  <rect x="980" y="200" width="260" height="110" rx="10" class="svc"/>
  <text x="1000" y="250" font-size="18" class="text-main">LiteLLM Router</text>
  <text x="1000" y="278" font-size="13" class="text-sub">Route to Local / Cloud</text>

  <!-- Local Model -->
  <rect x="1200" y="180" width="200" height="100" rx="8" class="box"/>
  <text x="1220" y="230" font-size="16" class="text-main">Ollama</text>
  <text x="1220" y="256" font-size="12" class="text-sub">Qwen2.5-Coder-7B</text>

  <!-- Gemini -->
  <rect x="1200" y="320" width="200" height="100" rx="8" class="box"/>
  <text x="1220" y="370" font-size="16" class="text-main">Gemini</text>
  <text x="1220" y="396" font-size="12" class="text-sub">Cloud model for hard requests</text>

  <!-- Database -->
  <rect x="620" y="460" width="360" height="140" rx="10" class="svc"/>
  <text x="660" y="510" font-size="20" class="text-main">PostgreSQL</text>
  <text x="660" y="544" font-size="14" class="text-sub">Sessions, metadata, entitlements</text>

  <!-- Arrows -->
  <path class="line" d="M334 300 L380 320" />
  <path class="line" d="M600 320 L660 320" />
  <path class="line" d="M880 300 L940 270" />
  <path class="line" d="M1160 270 L1200 245" />
  <path class="line" d="M1160 360 L1200 380" />
  <path class="line" d="M800 400 L800 460" />

  <!-- small nodes/hints -->
  <circle cx="560" cy="260" r="7" class="node"/>
  <circle cx="900" cy="250" r="7" class="node"/>

  <!-- footer note -->
  <text x="64" y="940" font-size="14" fill="#72839b">Bekzat Uraimov · Backend engineer. Python · FastAPI · PostgreSQL</text>
</svg>
