<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5a4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .bg{fill:#0b0b0c}
      .node{fill:url(#g);opacity:0.95}
      .edge{stroke:rgba(255,255,255,0.08);stroke-width:4;stroke-linecap:round}
      .label{fill:#e8eefc;font-family:Inter,system-ui,Arial;font-weight:700}
      .sub{fill:#9fb3d6;font-family:Inter,system-ui,Arial;font-weight:600}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="18"/>
  <!-- edges -->
  <path class="edge" d="M200 360 C350 260, 550 240, 700 180"/>
  <path class="edge" d="M300 220 C420 270, 600 300, 820 260"/>
  <path class="edge" d="M420 420 C540 360, 720 320, 920 380"/>
  <!-- nodes -->
  <circle class="node" cx="200" cy="360" r="26"/>
  <circle class="node" cx="300" cy="220" r="20"/>
  <circle class="node" cx="420" cy="420" r="28"/>
  <circle class="node" cx="700" cy="180" r="34"/>
  <circle class="node" cx="820" cy="260" r="22"/>
  <circle class="node" cx="920" cy="380" r="18"/>
  <!-- central box -->
  <rect x="60" y="80" width="420" height="120" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" />
  <text x="80" y="140" font-size="48" class="label">ThinkCoder</text>
  <text x="80" y="180" font-size="18" class="sub">AI coding assistant. Session-based orchestration.</text>
</svg>
