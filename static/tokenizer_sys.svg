<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <style>
    .bg{fill:#060606}
    .box{fill:#0f1720;stroke:#1f2937;stroke-width:2}
    .bar{fill:#fb923c}
    .line{stroke:#f97316;stroke-width:4;stroke-linecap:round;fill:none;marker-end:url(#arr)}
    .text-main{fill:#f8fafc;font-family:Inter,system-ui,Arial;font-weight:700}
    .text-sub{fill:#cbd5e1;font-family:Inter,system-ui,Arial;font-weight:600}
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <text x="64" y="120" font-size="48" class="text-main">Tokenizer for Central Asian languages</text>
  <text x="64" y="164" font-size="18" class="text-sub">Measuring token gap. C++ tokenizer prototype.</text>

  <!-- input -->
  <rect x="64" y="230" width="520" height="120" rx="10" class="box"/>
  <text x="84" y="288" font-size="20" class="text-main">Text input</text>
  <text x="84" y="318" font-size="14" class="text-sub">Kyrgyz, Kazakh, Uzbek, English</text>

  <!-- arrow to tokenizer -->
  <path class="line" d="M584 300 L760 300" />

  <!-- tokenizer box -->
  <rect x="760" y="230" width="360" height="150" rx="12" class="box"/>
  <text x="780" y="300" font-size="20" class="text-main">Tokenizer (C++)</text>
  <text x="780" y="332" font-size="14" class="text-sub">Tokenization algorithm, performance in C++</text>

  <!-- token bars (visual compare) -->
  <g transform="translate(100,420)">
    <rect x="0" y="0" width="1100" height="36" rx="8" fill="#0b1220"/>
    <rect class="bar" x="20" y="-10" width="1040" height="36" rx="8"/>

    <text x="20" y="90" class="text-sub" font-size="16">English (baseline)</text>
    <rect x="240" y="100" width="720" height="22" rx="8" fill="#fb923c" opacity="0.95"/>

    <text x="20" y="170" class="text-sub" font-size="16">Kyrgyz</text>
    <rect x="240" y="180" width="880" height="22" rx="8" fill="#fb923c" opacity="0.95"/>

    <text x="20" y="250" class="text-sub" font-size="16">Kazakh</text>
    <rect x="240" y="260" width="920" height="22" rx="8" fill="#fb923c" opacity="0.95"/>

    <text x="20" y="330" class="text-sub" font-size="16">Uzbek</text>
    <rect x="240" y="340" width="880" height="22" rx="8" fill="#fb923c" opacity="0.95"/>
  </g>

  <!-- footer note -->
  <text x="64" y="940" font-size="14" fill="#72839b">Bekzat Uraimov · C++, Python · Tokenization research</text>
</svg>
