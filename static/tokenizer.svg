<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffbf69"/>
    </linearGradient>
    <style>
      .bg{fill:#0b0b0c}
      .bar{fill:url(#g2);opacity:0.95}
      .label{fill:#f8fbff;font-family:Inter,system-ui,Arial;font-weight:700}
      .sub{fill:#bfcfe6;font-family:Inter,system-ui,Arial;font-weight:600}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="18"/>
  <!-- token bars -->
  <g transform="translate(120,110)">
    <rect class="bar" x="0" y="0" width="900" height="36" rx="8"/>
    <rect class="bar" x="40" y="80" width="720" height="28" rx="6" opacity="0.9"/>
    <rect class="bar" x="100" y="150" width="520" height="22" rx="5" opacity="0.85"/>
    <rect class="bar" x="200" y="210" width="320" height="18" rx="4" opacity="0.8"/>
  </g>
  <text x="80" y="120" font-size="42" class="label">Tokenizer</text>
  <text x="80" y="160" font-size="18" class="sub">Central Asian languages. C++ and Python.</text>
  <!-- small C++ and Python badges -->
  <g transform="translate(940,420)">
    <rect x="0" y="0" width="96" height="36" rx="8" fill="#2b2b2b" stroke="rgba(255,255,255,0.04)"/>
    <text x="12" y="24" font-size="16" fill="#fff" font-family="JetBrains Mono,monospace">C++</text>
  </g>
  <g transform="translate(1050,420)">
    <rect x="0" y="0" width="120" height="36" rx="8" fill="#2b2b2b" stroke="rgba(255,255,255,0.04)"/>
    <text x="12" y="24" font-size="16" fill="#fff" font-family="JetBrains Mono,monospace">Python</text>
  </g>
</svg>
