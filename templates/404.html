<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  var t = 'light';
  try {
    t = localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<title>Not found · Bekzat Uraimov</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%23090909%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%227%22%20fill%3D%22%23ff4d2e%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --bg:#ffffff; --ink:#121212; --muted:#8a8a93; --accent:#ff4d2e; --border:#eaeaea; }
[data-theme="dark"]{ --bg:#090909; --ink:#f5f5f6; --muted:#79797f; --border:#232326; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh; display:grid; place-items:center; padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{max-width:460px;text-align:center}
.code{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:13px; letter-spacing:.14em; color:var(--accent);
  display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:22px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
p{color:var(--muted);margin-top:14px;line-height:1.6}
a.home{
  display:inline-block;margin-top:30px;padding:11px 22px;
  border:1px solid var(--border);border-radius:999px;
  color:var(--ink);text-decoration:none;font-size:14px;font-weight:500;
  transition:border-color .2s ease, transform .2s ease;
}
a.home:hover{border-color:var(--accent);transform:translateY(-1px)}
</style>
</head>
<body>
  <main class="card">
    <div class="code"><span class="dot"></span>ERROR 404</div>
    <h1>This page doesn't exist.</h1>
    <p>The link is wrong or the page moved. Everything lives on one page anyway.</p>
    <a class="home" href="/">← Back to bekzat.dev</a>
  </main>
</body>
</html>
